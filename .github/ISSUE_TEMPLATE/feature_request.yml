name: 💡 Idea or feature request
description: Suggest something new, or an improvement to how MultiProxy works today
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea that would make running SkyrimNet easier? We'd love to hear it!

        Don't worry about having a complete technical solution designed—just telling us **what you're trying to do and what's getting in the way** is the most helpful part.

        💡 **Quick tip:** Take a quick glance through [existing ideas](https://github.com/awesmdiver/skyrimnet-multiproxy/issues?q=is%3Aissue+label%3Aenhancement) first to see if someone already pitched something similar.

  - type: dropdown
    id: area
    attributes:
      label: What's this about?
      options:
        - Support for an AI provider we don't have yet
        - An existing provider (models, streaming, errors)
        - The dashboard
        - The SKSE plugin that starts the proxy with Skyrim
        - Setup and installation
        - Logging and troubleshooting
        - Something else entirely
    validations:
      required: true

  - type: input
    id: provider-name
    attributes:
      label: Which AI service?
      description: Only if you're asking for a new provider—who are they, and where do we sign up?
      placeholder: e.g. Mistral — https://console.mistral.ai
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what gets in the way?
      description: Describe the friction you're running into today.
      placeholder: e.g. "I want cheap models for NPC small talk but a smarter one for the GameMaster, and right now I have to edit settings between sessions."
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How would you love to see this work?
      description: Your idea for how it could handle this. No wrong answers!
      placeholder: e.g. "Let me map a different model to each SkyrimNet task from the dashboard."
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: How are you dealing with this right now?
      description: (Optional) Another tool, a manual workaround, or just living with it?
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues to see if this has already been suggested.
          required: false
