[General]
; Which Python command to use depends on where your Python came from:
;
;   - Installed from python.org (https://www.python.org/downloads/): use "py". That
;     installer sets up a separate "py" launcher alongside "python", and "py" is the
;     more reliable choice here (see the note below).
;
;   - Installed from the Microsoft Store's "Python" app: use "python". That version
;     is a full, working Python installation too, but it does not come with the
;     separate "py" launcher.
;
; Why this setting exists: if Python isn't installed through EITHER of the above,
; Windows still provides a placeholder "python" command of its own. It silently opens
; the Microsoft Store instead of running anything, yet still reports success. If AI
; features aren't working and this is set to "python", that placeholder is worth
; ruling out: make sure Python is actually installed, or switch this to "py" if you
; installed it from python.org.
PythonExe=py

; Full path to proxy.py
ProxyScript=C:\Users\YourName\.local\bin\proxy.py

; Working directory for the proxy process (where config.json lives)
WorkDir=C:\Users\YourName\.local\bin

; Port the proxy listens on — used to detect if it's already running
Port=8000
