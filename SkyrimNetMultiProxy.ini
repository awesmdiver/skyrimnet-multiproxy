[General]
; Path to the Python executable. "python" works if it's on your PATH -- but on Windows, "python"
; is often a Microsoft Store alias stub that silently does nothing real, even though Windows
; reports it as launched successfully. "py" (the Python Launcher, a separate real executable
; Python's official installer always sets up) reliably finds a real interpreter instead.
PythonExe=py

; Full path to proxy.py
ProxyScript=C:\Users\YourName\.local\bin\proxy.py

; Working directory for the proxy process (where config.json lives)
WorkDir=C:\Users\YourName\.local\bin

; Port the proxy listens on — used to detect if it's already running
Port=8000
